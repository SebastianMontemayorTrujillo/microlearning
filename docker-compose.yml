services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/microlearn.db}
    volumes:
      - learning_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
  db:
    image: postgres:17-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: lilt
      POSTGRES_USER: lilt
      POSTGRES_PASSWORD: lilt_local_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lilt -d lilt"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  learning_data:
  postgres_data:
